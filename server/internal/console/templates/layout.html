{{define "layout"}}<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}} · wangshu hub console</title>
<style>
/* Flight Console 服务端版（console restrained 人格）——与客户端同 token 值；
   圆角与焦点语言随客户端 2026-11-13 绚烂拍板（DESIGN.md）：主体 8px 一档、
   行内 mini 钮胶囊（--pill）；焦点 2px 橙 offset 2（DESIGN.md:221 同款） */
:root{color-scheme:dark;--ground:#080C14;--paper:#0E1520;--panel-2:#121B29;--ink:#E6ECF4;--muted:#93A0B6;
--rule:#22304A;--rule-soft:#1A2540;--accent:#FF8A3D;--accent-deep:#FF6B1A;--ok:#53F2A5;
--telemetry:#6FD8FF;--red:#FF5D5D;--red-soft:#FF8A85;--red-dim:#E57373;--r:8px;--pill:999px;
--mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
::selection{background:rgba(255,138,61,.28)}
body{font:14px/1.65 var(--sans);color:var(--ink);background:var(--ground);
background-image:radial-gradient(900px 500px at 80% -10%,rgba(111,216,255,.07),transparent 60%)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{height:52px;display:flex;align-items:center;padding:0 24px;
border-bottom:1px solid var(--rule);background:rgba(14,21,32,.66)}
.brand{font:600 13px var(--mono);letter-spacing:.14em;padding-right:24px;border-right:1px solid var(--rule)}
.brand b{color:var(--accent)}
nav{display:flex;gap:24px}
header nav{padding-left:24px}
nav a{font:500 12.5px var(--mono);letter-spacing:.06em;color:var(--muted);text-decoration:none;
padding:6px 0 4px;border-bottom:2px solid transparent}
nav a.cur{color:var(--ink);border-bottom-color:var(--accent)}
nav a:hover{color:var(--ink)}
.who{margin-left:auto;font:12px var(--mono);color:var(--muted)}
.who form{display:inline}
main{max-width:1080px;margin:0 auto;padding:24px}
h1{font-size:21px;font-weight:600;margin:8px 0 16px}
.phase{font:600 11px var(--mono);letter-spacing:.16em;color:var(--telemetry)}
table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--rule-soft);
border-radius:var(--r);overflow:hidden}
th{font:600 11px var(--mono);letter-spacing:.14em;color:var(--muted);text-align:left;
padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--panel-2)}
th.num{text-align:right}
td{padding:12px 14px;border-bottom:1px solid var(--rule-soft);font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(230,236,244,.03)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.st{font:600 11px var(--mono);letter-spacing:.1em}
.st::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
background:currentColor;margin-right:7px;vertical-align:1px}
.st.ok{color:var(--ok)}.st.dim{color:var(--muted)}.st.bad{color:var(--red)}
.card{background:var(--paper);border:1px solid var(--rule-soft);border-radius:var(--r);padding:24px;margin:24px 0}
.card h2{font:600 11px var(--mono);letter-spacing:.16em;color:var(--muted);margin-bottom:16px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.fgrid label{display:flex;flex-direction:column;gap:5px;font:500 11px var(--mono);
letter-spacing:.12em;color:var(--muted)}
input,select{font:13px var(--sans);color:var(--ink);background:var(--panel-2);
border:1px solid var(--rule);border-radius:var(--r);padding:8px 12px}
input::placeholder{color:var(--muted);opacity:1}
input:focus,select:focus{outline:none;border-color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:500 12px var(--mono);letter-spacing:.05em;padding:8px 18px;border-radius:var(--r);
cursor:pointer;border:1px solid var(--rule);background:transparent;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:#1A0D05;border-color:var(--accent)}
.btn.pri:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.danger{color:var(--red-dim);border-color:transparent}
.btn.danger:hover{color:var(--red);border-color:rgba(255,93,93,.45)}
.btn.mini{padding:4px 12px;font-size:11px;border-radius:var(--pill)}
.errline{font:12px var(--mono);color:var(--red-soft);border-left:2px solid var(--red);
padding-left:10px;margin-bottom:16px}
.okline{font:12px var(--mono);color:var(--ok);margin-bottom:16px}
.acts{display:flex;gap:8px;justify-content:flex-end}
footer{max-width:1080px;margin:0 auto;padding:0 24px 28px;font:600 11px var(--mono);
letter-spacing:.14em;color:var(--muted)}
</style>
</head>
<body>
<header>
  <span class="brand">WANGSHU <b>CONSOLE</b></span>
  <nav>
    <a href="/console/models" {{if eq .Page "models"}}class="cur"{{end}}>模型池</a>
    <a href="/console/pricing" {{if eq .Page "pricing"}}class="cur"{{end}}>计价</a>
    <a href="/console/mcp" {{if eq .Page "mcp"}}class="cur"{{end}}>MCP</a>
    <a href="/console/usage" {{if eq .Page "usage"}}class="cur"{{end}}>用量</a>
    <a href="/console/material" {{if eq .Page "material"}}class="cur"{{end}}>素材</a>
  </nav>
  <span class="who">{{.UserID}} · {{.Role}} <form method="post" action="/console/logout"><button class="btn mini">登出</button></form></span>
</header>
<main>{{template "content" .}}</main>
<footer>望舒 wangshu · hub</footer>
</body>
</html>{{end}}
